<style>
:root{--bg:#e9f3e8;--side:#f3f9f2;--card:#fbfdfb;--ink:#14261f;--mut:#6b7f75;--line:#dbe7dc;--dk:#1f4d40;--lm:#b8f08c;--out:#c0453a;--in:#1f7a4d;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:980px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button.pri{background:var(--dk);border-color:var(--dk);color:#fff}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.f .w{grid-column:1/-1}
.row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.mut{color:var(--mut);font-size:13px}
.pos{color:var(--in)}.neg{color:var(--out)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;display:none}
</style>
