<body>
<div class="app">
<aside class="side"><div class="logo">◆◆ Nosso Caixa</div><div id="nav" style="display:contents"></div>
<div class="tip">Combinado do casal: 10 minutos por semana para olhar este painel juntos. Sem surpresa, sem briga.</div></aside>
<main>
<div class="top"><h1 id="ttl"></h1><div class="month"><button data-act="mp" aria-label="Mês anterior">‹</button><b id="ml"></b><button data-act="mn" aria-label="Próximo mês">›</button></div><button data-act="diag" class="x" aria-label="Diagnostico de conexao" title="Diagnostico de conexao">&#129658;</button><div class="av" id="av"></div></div>
<div class="sync" id="sync" style="margin:-8px 0 12px"></div>
<div id="app"></div>
</main>
</div>
<div id="sheet"></div>
<div id="toast" role="status"></div>
<script>
function hasGAS(){
  try { return typeof google !== 'undefined' && !!google && google.script && typeof google.script.run === 'object'; }
  catch(e) { return false; }
}
function ncId(){
  try { if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') return crypto.randomUUID(); } catch(e) {}
  return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2);
}
function normalizeRaw(raw){
  if (raw === null || raw === undefined) throw new Error('resposta vazia do servidor');
  if (typeof raw === 'string') {
    const txt = raw.trim();
    try { raw = JSON.parse(txt); }
    catch(e) { throw new Error('resposta nao-JSON: ' + txt.slice(0, 180)); }
  }
  if (raw && typeof raw === 'object' && raw.ok === false) {
    const serverErr = new Error(raw.error || 'erro desconhecido do servidor');
    serverErr.serverResult = true; // resposta legitima do backend, nao falha de transporte
    throw serverErr;
  }
  return raw;
}
/* ============================================================
   Bridge JSONP — Google Apps Script + Google Sheets
   Nao usa google.script.run. Chama a URL do Web App e recebe
   uma resposta javascript: callback({...});
   ============================================================ */
let NC_API_URL = ("https://script.google.com/macros/s/AKfycbyHEthk6Rimjd639ahGI8ZwfkrX5kHffEmEhomUyh3oPcMu95yFUtwvU1ZkVaADxzqF4Q/exec").trim();
if (NC_API_URL.charAt(0) === '<' || NC_API_URL.indexOf('ncApiUrl_') >= 0) NC_API_URL = '';

function ncApiBase(){
  if (NC_API_URL) return NC_API_URL;

  let saved = '';
  try { saved = (localStorage.getItem('nc_api_url') || '').trim(); } catch(e) {}
  if (saved) { NC_API_URL = saved; return saved; }

  if (/^https?:$/i.test(location.protocol)) {
    const u = location.origin + location.pathname;
    if (/(\/exec|\/dev)$/.test(u) || /^script\.google\.com$/i.test(location.hostname)) {
      NC_API_URL = u; return u;
    }
  }

  // Prompt apenas no HTML local (fora da GAS)
  if (!hasGAS()) {
    try { saved = (window.prompt('Cole a URL do App da Web do Apps Script (termina em /exec):') || '').trim(); } catch(e) {}
    if (saved) {
      try { localStorage.setItem('nc_api_url', saved); } catch(e) {}
      NC_API_URL = saved; return saved;
    }
  }
  return '';
}

let __ncSeq = 0;

function ncJsonp(action, args){
  return new Promise((resolve, reject) => {
    const base = ncApiBase();
    if (!base) { reject(new Error('URL do Apps Script nao configurada')); return; }

    const cb = '__nc_cb_' + (++__ncSeq) + '_' + Date.now().toString(36);
    const s = document.createElement('script');
    let done = false;

    const timer = setTimeout(function(){ finish(new Error('timeout de 30s')); }, 30000);

    function finish(err, data){
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
      if (err) reject(err); else resolve(data);
    }

    window[cb] = function(data){ finish(null, data); };
    s.onerror = function(){ finish(new Error('falha de rede ao chamar o Apps Script')); };

    const sep = base.indexOf('?') < 0 ? '?' : '&';
    s.src = base + sep +
      'action=' + encodeURIComponent(action) +
      '&payload=' + encodeURIComponent(JSON.stringify(args || [])) +
      '&callback=' + encodeURIComponent(cb) +
      '&_=' + Date.now();

    document.head.appendChild(s);
  });
}

/* POST via formulario oculto: usado quando o payload passa do limite de URL.
   A escrita acontece; o syncAll() seguinte le o resultado real da planilha. */
function ncFormPost(action, args){
  return new Promise(function(resolve){
    const base = ncApiBase();
    if (!base) { resolve({ ok:false, error:'URL do Apps Script nao configurada' }); return; }

    const frameName = '__nc_frame_' + (++__ncSeq) + '_' + Date.now().toString(36);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = base;
    form.target = frameName;
    form.style.display = 'none';

    const fAction = document.createElement('input');
    fAction.type = 'hidden'; fAction.name = 'action'; fAction.value = action;

    const fPayload = document.createElement('input');
    fPayload.type = 'hidden'; fPayload.name = 'payload'; fPayload.value = JSON.stringify(args || []);

    form.appendChild(fAction);
    form.appendChild(fPayload);
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    form.submit();

    setTimeout(function(){
      try { form.parentNode.removeChild(form); } catch(e) {}
      try { iframe.parentNode.removeChild(iframe); } catch(e) {}
      resolve({ ok:true, async:true });
    }, 1200);
  });
}

const NC_ACTION = {
  ping:'ping', bootstrap:'bootstrap', selftest:'selftest',
  adicionar:'add', salvarDoc:'save', atualizar:'update', excluir:'delete', salvarCfg:'cfg'
};

async function server(fn, ...args){
  const action = NC_ACTION[fn] || fn;
  let lastErr = null;

  // Transporte preferencial dentro do Web App (funciona no mobile, sem prompts)
  if (hasGAS()){
    try {
      const raw = await new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(r => resolve(r))
          .withFailureHandler(err => reject(new Error(err && (err.message || err))))
          .ncApi(action, JSON.stringify(args || []));
      });
      return normalizeRaw(raw);
    } catch(e) {
      // Resposta legítima do servidor (payload ok:false, erro de negócio):
      // nao é falha de transporte; devolve direto sem duplicar a chamada via JSONP.
      if (e && e.serverResult) throw e;
      // Qualquer outra falha na ponte google.script.run (ncApi ausente em
      // versao antiga do deploy, erro de serializacao, etc.): cai no JSONP,
      // que tambem funciona dentro do Web App.
      lastErr = e;
    }
  }

  // Fallback JSONP (HTML local e tambem dentro do Web App)
  try {
    const out = await ncJsonp(action, args);
    return normalizeRaw(out);
  } catch(e) {
    const parts = [];
    if (lastErr) parts.push('bridge: ' + ((lastErr && (lastErr.message || lastErr)) || ''));
    parts.push('jsonp: ' + ((e && (e.message || e)) || ''));
    throw new Error(action + ': ' + parts.filter(Boolean).join(' | '));
  }
}
/* ============================================================
   Diagnostico de conexao — testa cada transporte isoladamente
   ============================================================ */
let __diagSel=null;
function diagPreenchEsp(c){
  if(!__diagSel)return;
  const set=new Set();
  for(const kk of SCOPED){ for(const d of ((c&&c[kk])||[])){ if(d&&d.esp) set.add(String(d.esp)); } }
  const cur=__diagSel.value;
  __diagSel.innerHTML=(set.size?
    Array.from(set).map(function(v){ return '<option'+(v===cur?' selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>'; }).join('')
    :'<option value="">(nenhum esp nos dados)</option>');
}
function ncSavedUrl(){
  try { return (localStorage.getItem('nc_api_url') || '').trim(); } catch(e) { return ''; }
}

function viaGAS(action, args){
  return new Promise(function(resolve, reject){
    try {
      if (!hasGAS()) throw new Error('google.script.run indisponivel');
      google.script.run
        .withSuccessHandler(function(r){ resolve(r); })
        .withFailureHandler(function(e){ reject(new Error(e && (e.message || e))); })
        .ncApi(action, JSON.stringify(args || []));
    } catch(e) { reject(e); }
  });
}

/* Reapontamento de esp: origem -> destino ('f' = familia compartilhada, p_<uid> = pessoal) */
async function reespPara(from, alvo){
  if(!from){ toast('Escolha o esp de origem no seletor do diagntico'); return; }
  if(from===alvo){ toast('Origem e destino iguais'); return; }
  if(!confirm('Reapontar TODOS os documentos de "'+from+'" para "'+alvo+'"?')) return;
  let n=0, erros=0;
  for(const cc of SCOPED){
    for(const dd of (RAW[cc]||[])){
      if(String(dd.esp||'')===from){
        try { await upd(cc, dd.id, {esp:alvo}); n++; }
        catch(e2){ erros++; }
      }
    }
  }
  toast('Reapontados: '+n+(erros? (' | erros: '+erros) : ' | sucesso'));
}

function diagOpen(){
  const existente=document.getElementById('diagOverlay');
  if(existente){ existente.remove(); return; }

  const ov=document.createElement('div');
  ov.id='diagOverlay';
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label','Diagnostico de conexao');
  ov.setAttribute('style','position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px');

  const card=document.createElement('div');
  card.setAttribute('style','background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden');

  const head=document.createElement('div');
  head.setAttribute('style','display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)');
  head.innerHTML='<b style="font-size:15px">&#129658; Diagn&oacute;stico de conex&atilde;o</b>';
  const bx=document.createElement('button');
  bx.className='x';bx.textContent='\u2715';bx.setAttribute('aria-label','Fechar');
  bx.addEventListener('click',function(){ ov.remove(); });
  head.appendChild(bx);

  const pre=document.createElement('pre');
  pre.setAttribute('style','margin:0;padding:12px 14px;overflow:auto;flex:1;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--ink)');
  pre.textContent='Coletando...';

  const foot=document.createElement('div');
  foot.setAttribute('style','display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap');
  const bCopy=document.createElement('button');
  bCopy.className='lm';bCopy.textContent='Copiar';
  bCopy.addEventListener('click',function(){
    const txt=pre.textContent;
    function ok(){ toast('Diagnostico copiado'); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok,function(){fallback()}); }
    else fallback();
    function fallback(){ const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Diagnostico copiado')}catch(e){toast('Nao foi possivel copiar')}ta.remove(); }
  });
  const bRef=document.createElement('button');
  bRef.textContent='De novo';
  bRef.addEventListener('click',function(){ pre.textContent='Coletando...'; diagRun(pre); });
  foot.appendChild(bCopy);foot.appendChild(bRef);

  const urlRow=document.createElement('div');
  urlRow.setAttribute('style','display:flex;gap:6px;width:100%;flex-wrap:wrap;align-items:center;margin-top:4px');
  const inp=document.createElement('input');
  inp.type='text';
  inp.value=ncSavedUrl() || NC_API_URL || '';
  inp.placeholder='Cole aqui a URL .../exec';
  inp.setAttribute('aria-label','URL do Web App do Apps Script');

async function diagRun(pre){
  const L=[];
  const push=function(x){ L.push(x); pre.textContent=L.join('\n'); };

  push('URL: ' + String(location.href||'').slice(0,140));
  push('hasGAS: ' + hasGAS());
  push('apiBase: ' + (ncApiBase() || '(VAZIO!)'));
  push('URL salva (localStorage): ' + (ncSavedUrl() || '(nenhuma)'));
  push('');

  // Google.script.run com telefone offline ping: presenca, latencia e usuario da sessao
  const t0=Date.now();
  try {
    const r=normalizeRaw(await viaGAS('ping'));
    push('GAS ping: OK ' + (Date.now()-t0) + 'ms | version=' + (r&&r.version) + ' | user=' + JSON.stringify(r&&r.user));
  } catch(e) { push('GAS ping: ERRO ' + ((e&&e.message)||e)); }

  // JSONP directly pelo /exec: revela bloqueio de cookie de 3a classe / rede
  try {
    const t1=Date.now();
    const r2=normalizeRaw(await ncJsonp('ping'));
    push('JSONP ping: OK ' + (Date.now()-t1) + 'ms | version=' + (r2&&r2.version));
  } catch(e) { push('JSONP ping: ERRO ' + ((e&&e.message)||e)); }
  push('');

  // bootstrap com contagem por colecao, para ver se os dados voltam
  try {
    const b=normalizeRaw(await viaGAS('bootstrap'));
    const c=(b&&b.collections)||{};
    push('bootstrap GAS: temperaturas ok=' + (b&&b.ok) + ' | tx=' + (c.tx||[]).length + ' | contas=' + (c.contas||[]).length + ' | goals=' + (c.goals||[]).length + ' | membros=' + (c.membros||[]).length + ' | cfg=' + (c.cfg||[]).length);
    if(b&&b.cfg_main) push('cfg_main: names=' + JSON.stringify(b.cfg_main.names) + ' | saldo=' + b.cfg_main.saldo);
    if(b&&b.cfg_p) push('cfg_p: ' + JSON.stringify(Object.keys(b.cfg_p)));
    push('uid ativo: ' + S.uid);
    push('esp(tx): ' + (((c.tx||[]).map(function(t){return (t&&t.esp)||(t?'(sem esp)':'')}).filter(Boolean).join(' | ')) || '(vazio)'));
    push('perfis(uid): ' + (((c.perfis||[]).map(function(p){return p&&p.uid})).join(' | ') || '(vazio)'));
    diagPreenchEsp(c);
  } catch(e) { push('bootstrap GAS: ERRO ' + ((e&&e.message)||e)); }

  try {
    const b2=normalizeRaw(await ncJsonp('bootstrap'));
    const c2=(b2&&b2.collections)||{};
    push('bootstrap JSONP: ok=' + (b2&&b2.ok) + ' | tx=' + (c2.tx||[]).length + ' | contas=' + (c2.contas||[]).length);
  } catch(e) { push('bootstrap JSONP: ERRO ' + ((e&&e.message)||e)); }
  push('');

  // selftest do servidor (inclusive abas e contagem de linhas de cada aba)
  if (hasGAS()){
    try {
      const st=normalizeRaw(await viaGAS('selftest'));
      push('--- SELFTEST (server) ---');
      String((st&&st.text)||JSON.stringify(st)).split('\n').forEach(function(x){ push(x); });
    } catch(e) { push('selftest: ERRO ' + ((e&&e.message)||e)); }
  }

  push('');
  push('FIM — copie e cole no suporte.');
}

const Core=(()=>{

async function authSubmit(modo,d){

    else if(d.act==='payocc'){if(S.busy)return;S.busy=1;try{const c=S.contas.find(z=>z.id===d.id),v=document.getElementById('d_'+d.key)?.value||today(),r=Core.pay(c,d.comp,v,paidMap());if(!r.ok){toast(r.reason==='duplicado'?'Esta conta já foi paga':'Não foi possível pagar ('+r.reason+')');return}const p=r.pagamento;await put('pagamentos',p.id,p);await put('tx','pg_'+p.id,{type:'out',amount:p.amount,cat:p.cat,who:p.who,shared:p.shared,date:p.paidOn,comp:p.comp,desc:p.name,ts:Date.now()});toast('Pagamento registrado')}finally{S.busy=0}}
    else if(d.act==='recv'){if(S.busy)return;S.busy=1;try{const r=S.recebimentos.find(z=>z.id===d.id),key=d.id+'_'+d.comp;if(S.tx.some(x=>x.id==='rc_'+key)){toast('Este recebimento já foi registrado');return}await put('tx','rc_'+key,{type:'in',amount:r.amount,cat:'Salário',who:r.who??0,date:document.getElementById('d_'+d.key)?.value||today(),comp:d.comp,desc:r.name,ts:Date.now()});toast('Recebimento registrado')}finally{S.busy=0}}
    else if(d.act==='payfat'){if(S.busy)return;S.busy=1;try{const ps=planState(),r=Plan.payInvoice(ps.invoices.find(v=>v.id===d.id),document.getElementById('f_'+d.id)?.value||today(),ps.paidInv);if(!r.ok){toast(r.reason==='duplicado'?'Esta fatura já foi paga':'Não foi possível pagar ('+r.reason+')');return}for(const x of r.tx)await put('tx',x.id,{...x,ts:Date.now()});await put('faturas',r.fatura.id,r.fatura);toast('Fatura paga')}finally{S.busy=0}}
    else if(d.act==='proj'){S.projSel=d.id;render(1);scrollTo(0,0)}
    else if(d.act==='projback'){S.projSel=null;render(1)}
    else if(d.act==='projedit'){S.projEdit=d.id;S.projSel=null;render(1);scrollTo(0,0)}
    else if(d.act==='projnoedit'){S.projEdit=null;render(1)}
    else if(d.act==='edit'){S.edit=d.id;render(1);scrollTo(0,0)}
    else if(d.act==='noedit'){S.edit=null;render(1)}
    else if(d.act==='dis')await put('avisos',d.key,{ts:Date.now()});
    else if(d.act==='cancelrec'){if(confirm('Cancelar a partir de '+dm(d.comp)+'? Pagamentos já feitos continuam no histórico.')){const c=S.contas.find(z=>z.id===d.id);await upd('contas',c.id,{canceledFrom:Core.cancel(c,d.comp).canceledFrom})}}
    else if(d.act==='pay_old'){const x=S.bills.find(z=>z.id===d.id);await add('tx',{type:'out',amount:x.amount,cat:x.cat,who:+x.who,shared:!!x.shared,date:today(),desc:x.name,ts:Date.now()});await upd('bills',x.id,{paid:{...(x.paid||{}),[S.month]:true}});toast('Conta marcada como paga')}
    else if(d.act==='settle'){await add('tx',{type:'ac',amount:+d.v,who:d.who,to:d.to,date:today(),desc:'Acerto de contas',ts:Date.now()});toast('Acerto registrado')}
  }catch(err){toast('Erro: ' + (err && (err.message||err)))}
});
document.addEventListener('submit',async e=>{

  const sb=f.querySelector('button[type="submit"],button');

  try{
    if(f.dataset.f==='tx'){await add('tx',{type:d.type,amount:+d.amount,cat:d.cat,who:d.who,shared:d.type==='out'&&!!d.shared,date:d.date,desc:d.desc.trim(),fonte:d.fonte?.trim()||'',ts:Date.now()});S.pre=d.type}
    else if(f.dataset.f==='conta'){const e=S.contas.find(c=>c.id===S.edit),base={name:d.name.trim(),cat:d.cat,amount:+d.amount,who:d.who,pay:d.pay,notes:d.notes.trim(),shared:!!d.shared},sch=e&&!Core.canEditSchedule(e,S.pagamentos)?{}:{due:d.due,rec:d.rec,n:Math.max(1,Math.floor(+d.n||1)),every:Math.max(1,Math.floor(+d.every||1)),unit:d.unit};if(e){await upd('contas',e.id,{...base,...sch});S.edit=null;toast('Conta atualizada')}else{await add('contas',{...base,...sch,canceledFrom:null,created:Date.now()});toast('Conta cadastrada')}}
    else if(f.dataset.f==='projeto'){const nn=k=>d[k]===''||d[k]===undefined?null:+d[k],tx=nn('taxa'),n=nn('n'),card=d.cardId||'',tar=nn('tarifas')||0,cen=[{tipo:'vista',tarifas:tar}];
      if(n)cen.push({tipo:'parcelado',n:Math.floor(n),taxa:tx,parcela:nn('parcela'),cardId:card,tarifas:tar});
      if(n&&nn('entrada')>0)cen.push({tipo:'entrada',entrada:nn('entrada'),n:Math.floor(n),taxa:tx,parcela:null,cardId:card,tarifas:tar});
      if(nn('mensal')>0)cen.push({tipo:'economizar',mensal:nn('mensal')});
      const o={nome:d.nome.trim(),descricao:d.descricao.trim(),justificativa:d.justificativa.trim(),valor:+d.valor,categoria:d.categoria,prioridade:d.prioridade,prazo:d.prazo||'',forma:d.forma,extras:{unico:nn('unico')||0,mensal:nn('emens')||0},cenarios:cen},e=S.projetos.find(x=>x.id===S.projEdit);
      if(e){await upd('projetos',e.id,{...o,versao:(e.versao||1)+1});S.projEdit=null;S.projSel=e.id;toast('Projeto atualizado')}else{await add('projetos',{...o,versao:1,status:'pendente',criado:Date.now()});toast('Projeto criado')}}
    else if(f.dataset.f==='criar'){const codigo=gen();S.cfg={...S.cfg,familia:{nome:d.fam.trim(),codigo}};await saveCfg();await put('membros',S.uid,{uid:S.uid,nome:d.nome.trim(),papel:'admin',entrou:Date.now(),ativo:true});toast('Espaço criado')}
    else if(f.dataset.f==='entrar'){if(d.codigo.trim().toUpperCase()!==(S.cfg.familia?.codigo||'')){toast('Código inválido');return}const ex=S.membros.find(m=>m.id===S.uid);await put('membros',S.uid,{uid:S.uid,nome:d.nome.trim(),papel:ex?.papel||'adulto',entrou:ex?.entrou||Date.now(),ativo:true});toast('Bem-vindo(a)!')}
    else if(f.dataset.f==='dep2')await add('membros',{uid:null,nome:d.nome.trim(),papel:'filho',entrou:Date.now(),ativo:true});
    else if(f.dataset.f==='cadastro'||f.dataset.f==='login')await authSubmit(f.dataset.f,d);
    else if(f.dataset.f==='meunome'){const n=d.nome.trim();if(S.membro)await upd('membros',S.uid,{nome:n});if(S.perfis.some(x=>x.id===S.uid))await upd('perfis',S.uid,{nome:n});toast('Nome salvo')}
    else if(f.dataset.f==='criarfam'){const codigo=gen(),pe=RAWCFG.p||{},main={...pe,...(RAWCFG.main||{}),...(pe.saldo!==undefined?{saldo:pe.saldo}:{}),...(pe.budget?{budget:pe.budget}:{}),...(pe.reservaEmergencia!==undefined?{reservaEmergencia:pe.reservaEmergencia}:{}),familia:{nome:d.fam.trim(),codigo}};await server('salvarCfg','f',main);await put('membros',S.uid,{uid:S.uid,nome:S.perfil.nome,papel:'admin',entrou:Date.now(),ativo:true});await migrar();await syncAll();calcEsp();S.tab='familia';toast('Espaço familiar criado')}
    else if(f.dataset.f==='entrarfam'){if(d.codigo.trim().toUpperCase()!==(RAWCFG.main?.familia?.codigo||'')){toast('Código inválido');return}const ex=S.membros.find(m=>m.id===S.uid);await put('membros',S.uid,{uid:S.uid,nome:S.perfil.nome,papel:ex?.papel||(S.membros.some(m=>m.papel==='admin'&&m.ativo!==false)?'adulto':'admin'),entrou:ex?.entrou||Date.now(),ativo:true});await migrar();await syncAll();calcEsp();S.tab='familia';toast('Você entrou no espaço familiar')}
    else if(f.dataset.f==='saldo'){S.cfg={...S.cfg,saldo:+d.saldo,reservaEmergencia:+d.emerg||0};await saveCfg();toast('Saldo salvo')}
    else if(f.dataset.f==='rec')await add('recebimentos',{name:d.name.trim(),amount:+d.amount,due:d.due,rec:d.rec,who:d.who,canceledFrom:null});
    else if(f.dataset.f==='sim'){S.simq={amount:+d.amount,mode:d.mode,n:Math.max(1,Math.floor(+d.n||1)),date:d.date,cardId:d.cardId||''};render(1)}
    else if(f.dataset.f==='cartao')await add('cartoes',{name:d.name.trim(),limit:+d.limit,closeDay:Math.min(31,Math.max(1,Math.floor(+d.closeDay))),dueDay:Math.min(31,Math.max(1,Math.floor(+d.dueDay)))});
    else if(f.dataset.f==='compra'){if(!d.cardId){toast('Cadastre um cartão primeiro');return}await add('compras',{cardId:d.cardId,name:d.name.trim(),amount:+d.amount,date:d.date,n:Math.max(1,Math.floor(+d.n||1)),cat:d.cat,who:d.who})}
    else if(f.dataset.f==='gdl')await upd('goals',f.dataset.id,{deadline:d.deadline});
    else if(f.dataset.f==='goal')await add('goals',{name:d.name.trim(),target:+d.target,saved:0,deadline:d.deadline||''});
    else if(f.dataset.f==='dep'){const g=S.goals.find(z=>z.id===f.dataset.id);await upd('goals',g.id,{saved:(g.saved||0)+ +d.v})}
    else if(f.dataset.f==='names'){S.cfg.names=[d.n0.trim()||'Eu',d.n1.trim()||'Esposo'];await saveCfg();toast('Nomes salvos')}
  }catch(err){toast('Erro ao salvar: ' + (err && (err.message||err)))}
  finally{if(f.dataset.busy==='1'){delete f.dataset.busy;if(sb&&sb.isConnected){sb.disabled=false;sb.textContent=sb.dataset.label||'Salvar'}}}
});
document.addEventListener('change',async e=>{
  if(e.target.dataset?.role){const m=base().find(x=>x.id===e.target.dataset.role),v=e.target.value;if(m.papel==='admin'&&v!=='admin'&&members().filter(x=>x.papel==='admin').length<2){toast('A família precisa de pelo menos um administrador');render(1);return}try{await upd('membros',m.id,{papel:v})}catch(err){toast('Erro ao alterar: ' + (err && (err.message||err)))}return}
  if(e.target.dataset?.hor){S.hor=+e.target.value;render(1);return}
  if(e.target.dataset?.rem){const k=+e.target.dataset.rem,s=new Set(S.cfg.remind||[]);e.target.checked?s.add(k):s.delete(k);S.cfg={...S.cfg,remind:[...s]};try{await saveCfg()}catch(err){toast('Erro ao salvar: ' + (err && (err.message||err)))}return}
  const c=e.target.dataset?.cat;if(!c)return;
  S.cfg.budget={...S.cfg.budget,[c]:+e.target.value||0};
  try{await saveCfg()}catch(err){toast('Erro ao salvar limite: ' + (err && (err.message||err)))}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending&&!/INPUT|SELECT/.test(document.activeElement?.tagName||''))render(1)},60));

    };}

};
async function syncAll(){
  let ping=null;
  try { ping = await server('ping'); } catch(e){ ping = {err:String(e)}; }

  let data = null;
  let lastErr = null;
  for (let attempt=0; attempt<3; attempt++){
    try {
      const r = await server('bootstrap');
      console.log('bootstrap response:', r);
      // Aceita qualquer objeto de resposta valido do servidor
      if (r && typeof r === 'object') { data = r; break; }
      // Se veio null/undefined, tenta de novo ou vai para demo
      lastErr = new Error('resposta invalida: ' + JSON.stringify(r||null).slice(0,200));
      if (attempt===2) break;
    } catch(e){
      lastErr = e;
      if (attempt===2) break;
    }
  }
  if (!data){
    S.cloud=false; S.demo=true; S.uid='local@demo'; S.meNome='Usuario Local';
    S.today = new Date().toISOString().slice(0,10);
    try {
      const st = await server('selftest');
      const diag = (st && (st.text || st.diagnostico)) ? String(st.text || st.diagnostico) : JSON.stringify(st);
      console.error('SELFTEST\n' + diag);
    } catch(e) {
      console.error('SELFTEST falhou:', e);
    }
    toast('Falha ao carregar: ' + (lastErr && (lastErr.message||lastErr)) + ' | ping=' + JSON.stringify(ping).slice(0,140));
    return;
  }
  if (data.ok === false){
    toast('Erro do servidor: ' + (data.error||'erro desconhecido'));
    S.cloud=false; S.demo=true; S.uid='local@demo'; S.meNome='Usuario Local';
    S.today = new Date().toISOString().slice(0,10);
    return;
  }
  S.cloud=true; S.demo=false;
  /* Identidade: VOCE escolhe a conta no login; o nc_uid salvo no dispositivo
     tem prioridade. O uid do servidor so entra quando nao existe conta escolhida
     (o getActiveUser pode voltar vazio em implantaes anonimas). */
  let hintUid='';
  try { hintUid=(localStorage.getItem('nc_uid')||'').trim(); } catch(e){}
  S.uid = hintUid || ((data.user && data.user.uid) ? data.user.uid : (S.uid||'local@demo'));
  if (S.perfil && S.perfil.uid===S.uid) {
    try { localStorage.setItem('nc_uid', S.uid); } catch(e){}
  }
  S.meNome = (data.user && data.user.name) || S.meNome || 'Usuario';
  S.today = data.today || S.today;
  const cols = data.collections || {};
  for (const c of [...SCOPED,'membros','perfis']) {
    const arr = Array.isArray(cols[c]) ? cols[c] : [];
    if (SCOPED.includes(c)) RAW[c]=arr; else S[c]=arr;
  }
  RAWCFG.main = data.cfg_main || null;
  RAWCFG.p = data.cfg_p || null;
  S.rdy = {m:1,c:1,p:1};
  // ESSENCIAL: aplica o filtro de espaco (RAW -> S) e recalcula cfg.
  // Sem esta chamada os dados chegam da planilha mas nunca vao para a tela.
  if (typeof refilter === 'function') refilter();
  /* aps o refilter, S.perfil j reflete a coleo nova: persiste a identidade
     escolhida se ela tem conta confirmada (sincroniza entre recargas) */
  if (S.cloud && S.perfil && S.perfil.uid === S.uid) {
    try { localStorage.setItem('nc_uid', S.uid); } catch(e){}
  }
  if (data.warning) {
    console.warn('Aviso do servidor:', data.warning);
    toast('Atencao: ' + data.warning);
  }
}

async function initApp(){
  try{
    await syncAll();
    calcEsp();
    if (S.cloud && S.uid && !S.perfil && !S.deslogado) {
            try { await put('perfis', S.uid, {uid:S.uid, nome:S.meNome||'Usuario', metodo:'google', criado:Date.now()}); } catch(e){ /* ignora falha de perfil */ }
      await syncAll();
      calcEsp();
    }
  } catch (err) {
    console.error(err);
    toast('Não foi possível carregar: ' + (err && (err.message||err)));
    S.cloud=false; S.demo=true;
  }
  S.boot=false;
  render(1);
}
render(1);
initApp();
